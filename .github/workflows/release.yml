# Pushing a tag like v0.1.1 builds and publishes a GitHub release with:
#   bookhoard-v0.1.1-chrome.zip   for Chrome and Edge (the manifest as it is in the repo; its
#                                 "key" keeps one extension id whatever folder it's loaded from.
#                                 Remove it before any Chrome Web Store upload.)
#   bookhoard-v0.1.1-firefox.zip  for Firefox, which wants background "scripts" instead of a
#                                 service worker, plus its add-on id
#   bookhoard-v0.1.1-firefox.xpi  the same, signed by Mozilla so Firefox installs it for good.
#                                 Signed "unlisted": it is not published on Mozilla's add-ons site.
#                                 Needs the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets
#                                 (API keys from addons.mozilla.org); without them it is skipped.
# The tag must match "version" in manifest.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CAN_SIGN: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      # Third-party actions are pinned to exact commits (v4 and v2 at the time of pinning).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Check the tag matches manifest.json
        run: |
          version="v$(jq -r .version manifest.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - name: Build the zips
        # manifest.json sits at the top of each zip, so Firefox can load its zip as-is and
        # unzipping the Chrome one gives a folder Chrome and Edge can load.
        run: |
          zip -r "bookhoard-$GITHUB_REF_NAME-chrome.zip" manifest.json src icons LICENSE
          mkdir firefox
          cp -r src icons LICENSE firefox/
          jq 'del(.key)
              | .background = { scripts: [.background.service_worker], type: .background.type }
              | .browser_specific_settings = { gecko: {
                  id: "bookhoard@phillram.github.io",
                  strict_min_version: "128.0",
                  data_collection_permissions: { required: ["none"] } } }' \
            manifest.json > firefox/manifest.json
          (cd firefox && zip -r "../bookhoard-$GITHUB_REF_NAME-firefox.zip" .)

      - name: Sign the Firefox add-on (unlisted)
        if: env.CAN_SIGN == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@10.8.0 sign --source-dir firefox --artifacts-dir signed \
            --channel unlisted --approval-timeout 900000 \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          mv signed/*.xpi "bookhoard-$GITHUB_REF_NAME-firefox.xpi"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            bookhoard-${{ github.ref_name }}-chrome.zip
            bookhoard-${{ github.ref_name }}-firefox.zip
            bookhoard-${{ github.ref_name }}-firefox.xpi
          generate_release_notes: true
